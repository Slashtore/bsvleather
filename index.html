<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var path = sessionStorage.getItem('gh-redirect');
        if (path) {
          sessionStorage.removeItem('gh-redirect');
          window.history.replaceState(null, '', path);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSV Leather | Кожаная мастерская Воронеж | Ремни, Кошельки и Подарки на заказ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Lato"', 'sans-serif'],
              // Reverting strictly to Playfair Display as requested
              signature: ['"Playfair Display"', 'serif'],
            },
            colors: {
              leather: {
                50: '#FFFFFF',  /* Pure White */
                100: '#E7E5E4', /* Stone 200 - Visible Light Gray (Backgrounds) */
                200: '#A8A29E', /* Stone 400 - MEDIUM BORDER (Balanced: visible but soft) */
                300: '#57534E', /* Stone 600 */
                400: '#44403C', /* Stone 700 */
                500: '#292524', /* Stone 800 */
                600: '#1C1917', /* Stone 900 */
                700: '#0C0A09', /* Stone 950 */
                800: '#272321', /* Warm Charcoal/Dark Espresso */
                900: '#191716', /* Deepest Warm Black */
              }
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-out forwards',
              'fade-in-down': 'fadeInDown 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.3s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInDown: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth scrolling for anchor links */
