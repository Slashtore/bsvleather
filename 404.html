<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Сохраняем текущий путь
    var path = window.location.pathname.substring(1); // убираем первый слеш
    // Перенаправляем на главную с хешем
    if (path) {
      window.location.href = '/#' + path;
    } else {
      window.location.href = '/';
    }
  </script>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
